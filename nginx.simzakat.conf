# ==============================================================================
# Konfigurasi Nginx Reverse Proxy untuk SimZakat
# Salin ke VPS: sudo cp nginx.simzakat.conf /etc/nginx/sites-available/simzakat
# Edit domain:  sudo nano /etc/nginx/sites-available/simzakat
# Aktifkan:     sudo ln -s /etc/nginx/sites-available/simzakat /etc/nginx/sites-enabled/
# Uji & reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    
    # Ganti dengan domain atau subdomain Anda (contoh: zakat.masjidanda.com atau masjidanda.com)
    server_name zakat.masjidanda.com;

    # Batas ukuran upload dokumen & bukti transfer
    client_max_body_size 25M;

    # Gzip Compression untuk mempercepat loading halaman web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout handling
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache file statis Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
